name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  OTP_VERSION: "28"
  REBAR3_VERSION: "3.25.0"

jobs:
  # Compile + run the test suite on every push and PR. Leaf filter apps are
  # not published to hex (only the shared libs em_filter / rss_filter are), so
  # this workflow is test-only — no publish/tag/downstream jobs.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      # sied / kvex are native (Rust) NIF deps; the runner needs a C + Rust
      # toolchain to build them from the hex source packages.
      - name: Install NIF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache rebar3 deps
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-rebar3-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: ${{ runner.os }}-rebar3-

      - run: rebar3 compile
      - run: rebar3 eunit
